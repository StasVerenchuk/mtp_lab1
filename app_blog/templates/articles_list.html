<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Публікації</title>
</head>
<body>
    <a href="/">
        <h4>На головну</h4>
    </a>
    <h1>Публікації</h1>
    <br>


    {% if category %}
        {{category}}
    {% endif %}


    {% for item in items %}
        <div class="article-row">
            <a href="{{ item.get_absolute_url }}">
                <h4>{{ item.title }}</h4>
            </a>
            <h5>{{ item.pub_date|date:"j E Y" }}</h5>
            <p>{{ item.description|striptags|truncatewords_html:32 }}</p>


            {% if item.images.all %}
                <div class="container-image">
                    <img src="{{ item.images.all.0.image.url }}" alt="Зображення" class="img" width="300" height="200">
                </div>
            {% endif %}


            <div class="clearfix"></div>
        </div>
    {% endfor %}
</body>
</html>
